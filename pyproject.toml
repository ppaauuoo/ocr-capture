[project]
name = "ocr-capture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "addict",
    "dotenv>=0.9.9",
    "einops",
    "matplotlib",
    "meikiocr>=0.3.4",
    "mistral>=22.0.0",
    "mistralai>=2.5.2",
    "manga-ocr>=0.1.16",
    "ollama>=0.6.2",
    "onnxruntime-gpu>=1.21.0,<1.27.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "pillow>=12.3.0",
    "pyside6",
    "torch==2.6.0",
    "transformers==4.46.3",
    "tokenizers==0.20.3",
    "torchvision",
    "yomitoku",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
nvidia-cudnn-cu12 = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
