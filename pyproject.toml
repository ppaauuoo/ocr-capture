[project]
name = "ocr-capture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "mistral>=22.0.0",
    "mistralai>=2.5.2",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "torch==2.6.0",
    "transformers==4.46.3",
    "tokenizers==0.20.3",
    "einops",
    "addict",
    "matplotlib",
    "torchvision",
    "windows-capture>=2.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
